<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Page not found | WiSaw — free unaltered photos and videos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    CloudFront serves this file with status 404 (see WiSaw.cdk lib/resources/cloud-front.ts).
    It used to serve index.html with status 200 for every unknown URL, which made deleted and
    mistyped URLs look like live near-duplicate content. noindex keeps this page itself out of
    the index; it deliberately loads no bundle so it still renders when a deploy left the
    hashed assets missing.
  -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://wisaw.com/" />
  <link rel="icon" type="image/webp" href="/favicon-32x32.webp" sizes="32x32" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1a202c;
      background: linear-gradient(135deg, #00ff94 0%, #720cf0 100%);
    }

    main {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(20, 10, 60, 0.18);
    }

    h1 {
      font-size: 26px;
      margin: 0 0 10px;
    }

    p {
      margin: 0 0 22px;
      line-height: 1.55;
      color: #334155;
    }

    a.button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00ff94 0%, #720cf0 100%);
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }

    nav {
      margin-top: 18px;
      font-size: 14px;
    }

    nav a {
      color: #4c1d95;
      margin: 0 6px;
    }
  </style>
</head>

<body>
  <main>
    <h1>That page isn't here</h1>
    <p>The photo or video may have been removed, or the address has a typo. Browse what people
      are shooting today instead.</p>
    <a class="button" href="/">Browse free photos and videos</a>
    <nav>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/terms">Terms</a>
    </nav>
  </main>
</body>

</html>
