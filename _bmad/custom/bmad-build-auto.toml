# Team override for the BMad auto-build loop workflow — WiSaw.client.
# The local model endpoint allows at most THREE concurrent executions on the
# session's active model (see .github/copilot-instructions.md,
# "Execution Constraints", directive updated 2026-11-16).
# Arrays here APPEND to the defaults in <install-path>/customize.toml.

[workflow]

persistent_facts = [
  "Concurrency limit (hard): at most 3 model executions in flight at any moment — subagents, review lenses, and research assistants all count toward this cap. Never exceed 3 concurrent model calls; when a step names more than 3 items (e.g. every lens of a thorough review), run them in batches of at most 3 and handle each batch's results completely before launching the next. When the work is small enough that fan-out costs more coordination than it saves, or when fewer than 3 independent items exist, do it inline on this thread instead. Do not background or detach a model call beyond the cap, and never leave a launched execution unharvested.",
]

activation_steps_append = [
  "Apply the concurrency limit from persistent_facts for this whole run before starting step 01: plan at most 3 concurrent model executions, batch anything larger, and collect every launched result before finishing.",
]
